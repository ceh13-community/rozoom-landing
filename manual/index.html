<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Rozoom User Manual has moved</title>
  <!-- GitHub Pages cannot issue a real 301; this page is the closest
       equivalent: meta refresh + JS (preserves ?lang=uk) + canonical. -->
  <meta name="robots" content="noindex"/>
  <link rel="canonical" href="https://rozoom.app/docs/user/quickstart/"/>
  <meta http-equiv="refresh" content="0; url=/docs/user/quickstart/"/>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var lang = params.get('lang') || localStorage.getItem('rozoom-lang') || 'en';
      window.location.replace(
        lang === 'uk' ? '/uk/docs/user/quickstart/' : '/docs/user/quickstart/'
      );
    })();
  </script>
</head>
<body>
  <p>The manual has moved to <a href="/docs/user/quickstart/">rozoom.app/docs</a>.</p>
</body>
</html>
