  <style>
    :root {
      --bg: #0b0e14;
      --bg-glow: #131a2b;
      --fg: #e6edf3;
      --muted: #8b97a8;
      --accent: #3b82f6;
      --accent-fg: #ffffff;
      --border: #1f2733;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(120% 120% at 50% 0%, var(--bg-glow) 0%, var(--bg) 55%);
      color: var(--fg);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 720px; }
    .logo {
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .logo span { color: var(--fg); font-weight: 600; }
    h1 {
      font-size: clamp(2rem, 6vw, 3.4rem);
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }
    h1 .accent {
      background: linear-gradient(90deg, #60a5fa, #3b82f6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.lead {
      font-size: clamp(1.05rem, 2.4vw, 1.25rem);
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 36px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--accent);
      color: var(--accent-fg);
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      padding: 14px 26px;
      border-radius: 10px;
      transition: transform 0.12s ease, background 0.12s ease;
    }
    .cta:hover { background: #2f6fe0; transform: translateY(-1px); }
    .cta svg { width: 20px; height: 20px; fill: currentColor; }
    footer {
      margin-top: 48px;
      font-size: 13px;
      color: var(--muted);
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="logo">⎈ <span>Rozoom</span></div>
    <h1>Kubernetes clarity.<br /><span class="accent">Without the friction.</span></h1>
    <p class="lead">
      The Swiss Army Knife for Kubernetes. One desktop app that makes every
      cluster readable and debuggable at a glance — one app, every cluster,
      zero dependencies.
    </p>

  </main>
